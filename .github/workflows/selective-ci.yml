name: Selective CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  query-impact:
    name: Query impact (produce tests list)
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.set_output.outputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # ensure we have full refs for git diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start orchestrator (local runner)
        run: |
          # start uvicorn in background; adjust import path if you changed directories
          nohup python -m uvicorn code.src.orchestrator.main:app --host 127.0.0.1 --port 8000 > orchestrator.log 2>&1 &
          # wait for health endpoint
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "orchestrator up"
              break
            fi
            sleep 1
          done
          echo "orchestrator logs:"
          tail -n +1 orchestrator.log || true

      - name: Query orchestrator for impacted tests
        id: query
        env:
          ORCHESTRATOR_URL: http://127.0.0.1:8000
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/get_impacted.py --orchestrator-url "$ORCHESTRATOR_URL" --out tests.json || echo '["full"]' > tests.json
          echo "Detected tests:"
          cat tests.json

      - name: Set job outputs
        id: set_output
        run: |
          # Write job output via GITHUB_OUTPUT file (safer replacement for deprecated 'set-output')
          echo "tests<<EOF" >> $GITHUB_OUTPUT
          cat tests.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  run-tests:
    name: Run selected tests
    needs: query-impact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.query-impact.outputs.tests) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test deps (if any)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Make scripts executable
        run: chmod +x scripts/run_single_test.sh || true

      - name: Run selected test
        run: scripts/run_single_test.sh "${{ matrix.test }}"
