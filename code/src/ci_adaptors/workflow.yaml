name: Selective CI
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  query-impact:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.get.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Get impacted tests
        id: get
        run: |
          python tools/get_impacted.py
          echo "::set-output name=tests::$(cat tests.json)"
  run-tests:
    needs: query-impact
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: ${{ fromJson(needs.query-impact.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - name: Run selected test
        run: |
          echo "Run test for ${{ matrix.test }}"
          # simple mapping - run script that runs the appropriate tests
          ./scripts/run_single_test.sh "${{ matrix.test }}"
